name: Sync public BookStack content

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bookstack-public-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'Sandia-Heights-Homeowners-Association/SHHA-wiki'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Test exporter offline
        run: python -m unittest discover -s tests -v
      - name: Export anonymous public content
        env:
          BOOKSTACK_CONNECT_HOST: shha-wiki-fsgyhpgtg6gzc5aw.westus3-01.azurewebsites.net
        run: python scripts/sync_public_bookstack.py
      - name: Commit only the content mirror
        run: |
          git add --all -- bookstack-current
          if git diff --cached --quiet; then
            echo "Public wiki content is unchanged."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Sync public BookStack content'
          git push origin HEAD:main
