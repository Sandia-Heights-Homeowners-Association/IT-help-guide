name: Check wiki tools

on:
  push:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'export-bookstack.py'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'export-bookstack.py'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python -m py_compile export-bookstack.py scripts/*.py
      - run: python -m unittest discover -s tests -v
